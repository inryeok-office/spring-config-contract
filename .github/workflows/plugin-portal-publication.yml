name: Plugin Portal publication

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to publish or verify; only 0.1.0 is supported."
        required: true
        default: "0.1.0"
        type: string
      operation:
        description: "Publish once, or verify published consumers after Portal approval."
        required: true
        default: verify-published
        type: choice
        options:
          - publish
          - verify-published

permissions:
  actions: read
  contents: read

concurrency:
  group: plugin-portal-publication-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  protected-plugin-portal-publication:
    name: Protected Plugin Portal publication
    # The protected environment is evaluated before the job starts. Dispatches outside main never receive secrets.
    if: ${{ github.ref == 'refs/heads/main' && inputs.release_version == '0.1.0' && inputs.operation == 'publish' }}
    runs-on: ubuntu-latest
    environment: production-release
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Check out the approved workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify successful main CI for the checked-out commit
        uses: actions/github-script@v9
        env:
          MAIN_SHA: ${{ github.sha }}
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              branch: "main",
              status: "completed",
              per_page: 100,
            });
            const mainRun = runs.find((run) => run.head_sha === process.env.MAIN_SHA);
            if (!mainRun || mainRun.conclusion !== "success") {
              core.setFailed(`The checked-out main commit ${process.env.MAIN_SHA} has no successful CI run.`);
            }

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify released Maven Central runtime modules
        run: python3 .github/scripts/published_plugin_consumer_smoke.py --gradle ./gradlew --version "$RELEASE_VERSION" --mode central

      - name: Publish the approved Plugin Portal release
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :config-contract-gradle-plugin:publishPlugins -PreleaseVersion="$RELEASE_VERSION"

      - name: Record submission boundary
        run: |
          echo "Plugin Portal submission completed for $RELEASE_VERSION." >> "$GITHUB_STEP_SUMMARY"
          echo "This is not a completed release until Portal visibility and both published-consumer smoke tests pass." >> "$GITHUB_STEP_SUMMARY"

  protected-published-consumer-verification:
    name: Protected published-consumer verification
    # Run only after the Portal makes the first plugin visible, potentially after its manual approval process.
    if: ${{ github.ref == 'refs/heads/main' && inputs.release_version == '0.1.0' && inputs.operation == 'verify-published' }}
    runs-on: ubuntu-latest
    environment: production-release
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Check out the approved workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify successful main CI for the checked-out commit
        uses: actions/github-script@v9
        env:
          MAIN_SHA: ${{ github.sha }}
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              branch: "main",
              status: "completed",
              per_page: 100,
            });
            const mainRun = runs.find((run) => run.head_sha === process.env.MAIN_SHA);
            if (!mainRun || mainRun.conclusion !== "success") {
              core.setFailed(`The checked-out main commit ${process.env.MAIN_SHA} has no successful CI run.`);
            }

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Run public Plugin Portal consumer smoke tests
        run: python3 .github/scripts/published_plugin_consumer_smoke.py --gradle ./gradlew --version "$RELEASE_VERSION" --mode all
