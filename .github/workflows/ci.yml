name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # MIT-licensed cache provider; see docs/decisions/0001-gradle-actions-basic-caching.md
          cache-provider: basic
      - name: Verify Gradle wrapper line ending normalization
        shell: bash
        run: |
          git ls-files --eol gradlew.bat
          if ! git ls-files --eol gradlew.bat | grep -q '^i/lf '; then
            echo "gradlew.bat must be stored with LF in the Git index to match .gitattributes."
            exit 1
          fi
      - name: Run checks
        run: ./gradlew check
