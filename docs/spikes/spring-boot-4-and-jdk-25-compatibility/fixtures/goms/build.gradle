plugins {
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
    id 'io.github.inryeok-office.config-contract' version '0.1.0'
}

group = 'com.example'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict'
    }
}

// Selects one deployment variant: positive (default), negative, allmissing.
def deploySet = providers.gradleProperty('deploySet').getOrElse('positive')

configContract {
    dotenvExampleFiles.from("deploy/${deploySet}/.env.example")
    composeFiles.from("deploy/${deploySet}/compose.yml")
}
